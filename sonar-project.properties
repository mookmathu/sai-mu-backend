# ตั้งค่าสแกนคุณภาพโค้ดด้วย SonarQube (รันตามขั้นตอนใน docs/SONARQUBE.md)
sonar.projectKey=Sai-Mu-Backend
sonar.projectName=Sai Mu Backend
sonar.sources=app
sonar.tests=tests
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
# ไม่สแกนไฟล์สำรอง, รูปที่อัปโหลด, แคช และเอกสาร
sonar.exclusions=**/*backup*,**/__pycache__/**,uploads/**,docs/**,scripts/**,app/tests/**
# รายงาน coverage จาก pytest-cov (สร้างด้วย: python -m pytest tests --cov=app --cov-report=xml)
sonar.python.coverage.reportPaths=coverage.xml
