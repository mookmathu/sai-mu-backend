# CI: รันเทสต์อัตโนมัติทุกครั้งที่ push / เปิด PR
# Render จะ deploy (CD) เองเมื่อ push เข้า main — ดูผลเทสต์ที่แท็บ Actions ของ GitHub ก่อนหรือหลัง deploy ก็ได้
# (อยากให้ "เทสต์ผ่านก่อนค่อย deploy" ให้ไปที่ Render > Settings > Build & Deploy > Auto-Deploy เลือก "After CI Checks Pass")
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Compile check
        run: python -m compileall -q app

      - name: Run tests (sqlite ชั่วคราว ไม่เรียก Gemini/Supabase)
        run: python -m pytest tests -q
